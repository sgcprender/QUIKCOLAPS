# Alternate Path tool configuration.
# Every code-derived number lives here so the rules can change without code edits.
# Units: SI throughout (m, kN, kPa).

[code]
edition = "UFC 4-023-03 (2009, Change 4)"
risk_category = "II"          # AP-only is fully compliant for RC II Option 2
method = "Linear Static (simplified, all m-factors = 1.0)"

[loads]
# Amplified region gets amplification_factor x base combination.
# 2.0 == 2009 force-controlled factor (Table 3-4) and == deformation factor with m = 1.0.
amplification_factor = 2.0
dead_factor = 1.2
live_factor = 0.5
snow_factor = 0.2
# Roof: use the governing of (0.5 Lr) and (0.2 S). Options: "max", "live", "snow"
roof_live_rule = "max"
include_wind = false          # 2009 AP combinations have no wind
live_load_reduction = false   # permitted by 3-2.3 but must use pre-removal config; off = conservative

[removal]
# 3-2.9.2.2: other columns within this fraction of the largest bay dimension are removed too
simultaneous_fraction = 0.30
# Bay-size change trigger for extra candidates (ratio of adjacent perimeter spacings)
bay_change_ratio = 1.5
# Only external columns in hackathon scope
include_internal = false

[checks]
strength_ratio_limit = 1.0
# Base-reaction check tolerance (fraction of increment total)
reaction_check_tolerance = 0.01

[redesign]
max_iterations = 3

[claude]
model = "claude-opus-5-5"
max_tokens = 4000
